# DÉVELOPPEMENT UNIQUEMENT
# Usage : ./scripts/docker-dev.sh
# Prérequis : ./scripts/setup-env.sh (database/.env, backend/.env)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: app-db-postgres
    logging: *default-logging
    restart: always
    env_file:
      - database/.env
    ports:
      - "5432:5432"
    volumes:
      - ./database/init/postgres:/docker-entrypoint-initdb.d
      - app-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: app-pgadmin
    logging: *default-logging
    restart: always
    ports:
      - "5050:80"
    env_file:
      - database/.env
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - ./database/pgadmin/generate-config.sh:/app-pgadmin/generate-config.sh:ro
      - ./database/pgadmin/docker-entrypoint.sh:/app-pgadmin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/app-pgadmin/docker-entrypoint.sh"]
    depends_on:
      db-postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: app-redis
    logging: *default-logging
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    container_name: app-api
    logging: *default-logging
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - app-uploads:/app/uploads
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    depends_on:
      db-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    container_name: app-web
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DEV_PROXY_API: http://api:8080
    depends_on:
      - api

volumes:
  app-pg-data:
  app-uploads:
